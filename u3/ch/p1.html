<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part 1 · Cellular Homeostasis</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/u3/ch/ch.css">
<style>
.wc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.wc div{background:#eef2fc;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px}
.wc b{color:var(--teal);font-size:17px}
#lblw{position:relative;line-height:0;width:fit-content;max-width:100%;margin:6px auto;border:3px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
#lbl{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 14px;font:700 15px 'Open Sans',sans-serif;color:var(--ink);cursor:pointer;min-height:46px}
.chip.sel{border-color:var(--teal);background:#dbe3f6;box-shadow:0 0 0 3px #3a56a844}.chip.used{opacity:.35}
.defc{background:#fff8d6;border:2px solid #e6c84a;border-radius:12px;padding:10px 14px;margin:8px 0;min-height:56px;font-size:15px;line-height:1.5}
#fmw{line-height:0;width:fit-content;max-width:100%;margin:6px auto;border:3px solid var(--line);border-radius:12px;overflow:hidden}#fmw canvas{display:block;width:100%;height:auto}
table.vt{border-collapse:collapse;width:100%;font-size:15px}.vt td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}.vt td:first-child{font-weight:800;color:var(--teal);width:30%;background:#f3f6fc}
</style></head><body>
<div id="shell"></div>

<script src="/u3/ch/vocab.js"></script>

</body></html>

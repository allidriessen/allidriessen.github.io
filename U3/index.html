<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biology Virtual Labs: Unit page</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--ink:#1f1b2e;--muted:#6a647a;--card:#fff;--line:#e6e0d4;--teal:#1f7a8c;--magenta:#b5338a;--gold:#d99a1e;--shadow:0 1px 2px rgba(31,27,46,.06),0 8px 24px rgba(31,27,46,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#14111d;--ink:#f3f0fa;--muted:#a79fbd;--card:#1d1829;--line:#322b45;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;line-height:1.5}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px 320px at 12% 6%,color-mix(in srgb,var(--teal) 22%,transparent),transparent 70%),radial-gradient(480px 300px at 88% 10%,color-mix(in srgb,var(--magenta) 18%,transparent),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
header a{color:var(--muted);font-weight:600;text-decoration:none}
.un{margin:18px 0 0;color:var(--muted);font-weight:700;font-size:16px}
h1{margin:2px 0 0;font-size:clamp(34px,7vw,64px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
#grid{padding-bottom:64px}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="wrap">
<header>
  <a href="../index.html">← Biology Virtual Labs</a>
  <p class="un" id="un"></p>
  <h1 id="ut"></h1>
</header>
<main><nav class="tiles" id="grid" aria-label="Activities"></nav></main>
</div>
<script src="../assets/units.js"></script>
<script src="../assets/bvl.js"></script>
<script>
/* ===== TEACHER: UNIT PAGE SETTINGS =====
   UNIT_N: which unit this page is for (the title comes from assets/units.js).
   ACTIVITIES: one line per activity. url is relative to this page.
   release: the date it becomes visible. Add a future line anytime and it shows
   as a blurry magnifying glass until that date. */
const UNIT_N=3;
const ACTIVITIES=[
  {key:"u3-cancer",title:"Cancer Cell Exploration",desc:"How are cancer cells different from normal cells?",url:"https://allidriessen.github.io/U3/CCE/Home.html",release:"2026-10-23"}
  // ,{key:"u3-next",title:"Next activity",desc:"Short description",url:"next-activity.html",release:"2026-12-01"}
];
const U=BVL_UNITS.find(u=>u.n===UNIT_N)||{title:""};
document.title=U.title+" · Biology Virtual Labs";
document.getElementById("un").textContent="Unit "+UNIT_N;
document.getElementById("ut").textContent=U.title;
BVL.tiles(document.getElementById("grid"),ACTIVITIES);
</script>
</body>
</html>
